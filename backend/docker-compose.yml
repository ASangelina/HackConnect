services:
  postgres:
    image: postgres:16
    container_name: hackconnect-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: hackconnect
      POSTGRES_PASSWORD: devpassword
      POSTGRES_DB: hackconnect
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
